<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Phantom Subscription Admin</title>
  <style>
    :root{--bg:#0b0e13;--surface:#11161e;--surface2:#171d27;--line:#263141;--text:#eef3fb;--muted:#94a3b8;--primary:#426df8;--green:#35c77a;--red:#f3656b}
    *{box-sizing:border-box;letter-spacing:0}html{background:var(--bg);-webkit-text-size-adjust:100%;scroll-behavior:smooth}body{margin:0;min-width:320px;min-height:100vh;color:var(--text);font-family:Tahoma,Arial,sans-serif;background:var(--bg)}button,input,textarea{font:inherit}a{color:inherit;text-decoration:none}h1,h2,p{margin:0}
    .rail{position:fixed;inset:0 0 0 auto;width:236px;padding:24px 14px;background:#0e131a;border-left:1px solid var(--line);z-index:10}.brand{display:grid;place-items:center;width:48px;height:48px;margin-bottom:26px;border-radius:8px;background:var(--primary);font-weight:900}.rail nav{display:grid;gap:7px}.rail a{min-height:43px;display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:7px;color:var(--muted);font-weight:750;font-size:14px}.rail a:hover{background:var(--surface2);color:var(--text)}
    .workspace{margin-right:236px;padding:30px clamp(18px,3vw,46px) 60px;min-width:0}.page-head{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:24px}.page-head p,.panel-head p,.drawer p{color:var(--muted);font-size:12px}.page-head h1{font-size:26px;margin-top:4px}
    .panel{margin-bottom:18px;border:1px solid var(--line);border-radius:8px;background:var(--surface);overflow:clip}.panel-head{min-height:66px;display:flex;align-items:center;justify-content:space-between;gap:16px;padding:16px;border-bottom:1px solid var(--line)}.panel-head h2,.drawer h2{font-size:16px;margin-bottom:4px}.sticky{position:sticky;top:0;z-index:5;background:color-mix(in srgb,var(--surface) 94%,transparent);backdrop-filter:blur(12px)}
    .grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:13px;padding:16px}.settings-grid{grid-template-columns:repeat(3,minmax(0,1fr));border-top:1px solid var(--line)}.wide{grid-column:1/-1}label{display:grid;gap:7px;color:#bdc6d2;font-size:12px;font-weight:700;min-width:0}input,textarea{width:100%;min-width:0;min-height:42px;border:1px solid var(--line);border-radius:7px;outline:none;padding:9px 11px;color:var(--text);background:#0d1219}textarea{min-height:84px;resize:vertical;line-height:1.8}input[type=color]{padding:4px}input:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px rgba(66,109,248,.14)}
    .button{min-height:40px;border:0;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:8px 14px;cursor:pointer;font-weight:800;white-space:nowrap;background:var(--primary);color:white}.button.secondary{background:var(--surface2);border:1px solid var(--line)}.button.danger{background:rgba(243,101,107,.12);color:#ff858a;border:1px solid rgba(243,101,107,.25)}.button:disabled{opacity:.45;cursor:not-allowed}.actions{display:flex;justify-content:flex-end;gap:10px}.switch-row,.bulk-options{display:flex;flex-wrap:wrap;gap:10px;align-items:center}.switch,.checkline{display:flex;align-items:center;gap:8px;min-height:38px;color:var(--text)}.switch input,.checkline input,.row-check{width:18px;height:18px;min-height:18px;accent-color:var(--primary)}
    .collapse{width:100%;min-height:60px;border:0;display:flex;align-items:center;justify-content:space-between;padding:0 16px;background:transparent;cursor:pointer;color:var(--text);font-weight:850}.search{width:min(100%,430px);min-height:42px;display:flex;align-items:center;gap:8px;padding:0 12px;border:1px solid var(--line);border-radius:7px;background:#0d1219;color:var(--muted)}.search input{border:0;box-shadow:none;padding:0;background:transparent}
    .bulk{display:grid;grid-template-columns:minmax(220px,1fr) auto auto auto;align-items:center;gap:10px;padding:12px 16px;border-bottom:1px solid var(--line);background:#0e131a}.bulk-options{color:var(--muted);font-size:12px}.bulk-options label{display:flex;align-items:center;gap:6px;color:var(--muted)}
    .list{display:grid;gap:8px;padding:12px}.row{display:grid;grid-template-columns:28px minmax(0,1fr) minmax(135px,auto) auto;gap:13px;align-items:center;min-width:0;padding:12px;border:1px solid var(--line);border-radius:8px;background:#0d1219}.main{min-width:0;display:grid;gap:5px}.title{display:flex;flex-wrap:wrap;align-items:center;gap:7px;min-width:0}.title strong{overflow-wrap:anywhere}.title span,.title i{border-radius:6px;padding:3px 7px;background:rgba(66,109,248,.12);color:#91a9ff;font-style:normal;font-size:11px;white-space:nowrap}.title i{background:rgba(53,199,122,.12);color:#72dda5}.main p{color:var(--muted);font-size:12px;overflow-wrap:anywhere}.main a{direction:ltr;text-align:left;color:#85a0ff;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.meta{display:grid;gap:6px;color:var(--muted);font-size:11px;white-space:nowrap}.row-actions{display:flex;gap:6px;justify-content:flex-end;flex-wrap:wrap}.icon{width:36px;height:36px;display:inline-grid;place-items:center;flex:0 0 auto;border:1px solid var(--line);border-radius:7px;background:var(--surface2);cursor:pointer;color:var(--text)}.icon:hover{border-color:var(--primary);color:#9cb1ff}.icon.danger{color:#ff858a}.empty{padding:26px;text-align:center;color:var(--muted)}
    .backdrop{position:fixed;inset:0;z-index:30;display:none;justify-content:flex-start;background:rgba(2,6,23,.62)}.backdrop.open{display:flex}.drawer{width:min(100%,520px);min-height:100%;padding:20px;background:var(--surface);border-right:1px solid var(--line);overflow-y:auto}.drawer header{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;margin-bottom:18px}.drawer .grid{grid-template-columns:1fr;padding:0}.drawer .actions{position:sticky;bottom:0;padding:12px 0 0;background:var(--surface)}
    .toast{margin-bottom:14px;padding:11px 13px;border-radius:7px;font-weight:750;overflow-wrap:anywhere;display:none}.toast.ok{display:block;background:rgba(53,199,122,.12);color:#83e6b0;border:1px solid rgba(53,199,122,.26)}.toast.error{display:block;background:rgba(243,101,107,.12);color:#ff9aa0;border:1px solid rgba(243,101,107,.26)}
    @media(max-width:980px){.rail{position:sticky;top:0;inset:auto;width:auto;display:flex;align-items:center;gap:12px;padding:10px 12px;border-left:0;border-bottom:1px solid var(--line)}.brand{width:38px;height:38px;margin:0;font-size:13px}.rail nav{display:flex;gap:6px;overflow-x:auto}.rail a{min-height:38px;white-space:nowrap}.workspace{margin-right:0;padding:18px 12px 46px}.settings-grid{grid-template-columns:repeat(2,minmax(0,1fr))}.bulk{grid-template-columns:1fr}.row{grid-template-columns:24px minmax(0,1fr);align-items:start}.meta,.row-actions{grid-column:2}}
    @media(max-width:620px){.page-head,.panel-head{align-items:stretch;flex-direction:column}.grid,.settings-grid{grid-template-columns:1fr}.wide{grid-column:auto}.search{width:100%}.row{padding:10px;gap:10px}.row-actions{justify-content:flex-start}.meta{display:flex;flex-wrap:wrap;gap:8px 12px;white-space:normal}.button{width:100%}.actions{justify-content:stretch}}
  </style>
</head>
<body>
  <aside class="rail"><div class="brand">PH</div><nav><a href="#create">+ ساخت</a><a href="#settings">⚙ قالب</a><a href="#links">☑ لینک ها</a></nav></aside>
  <main class="workspace">
    <header class="page-head"><div><p>Phantom Subscription</p><h1>مدیریت پنل ساب</h1></div><button class="button secondary" id="reload">بروزرسانی</button></header>
    <div id="toast" class="toast"></div>
    <section class="panel" id="create"><div class="panel-head"><div><h2>تبدیل دستی لینک ساب</h2><p>لینک اختصاصی بدون رفرش صفحه ساخته می شود.</p></div></div><form class="grid" id="create-form"></form></section>
    <section class="panel" id="settings"><button class="collapse" id="settings-toggle"><span>⚙ تنظیمات قالب</span><span>⌄</span></button><form class="grid settings-grid" id="settings-form" hidden></form></section>
    <section class="panel" id="links"><div class="panel-head sticky"><div><h2>لینک های ثبت شده</h2><p id="count">...</p></div><div class="search">⌕ <input id="search" placeholder="جستجو بر اساس اسم، لینک اصلی، لینک ساخته شده..."></div></div><div class="bulk"><label class="checkline"><input type="checkbox" id="select-all"><span id="selected-count">انتخاب همه موارد نمایش داده شده</span></label><div class="bulk-options"><label><input type="checkbox" id="bulk-header" checked> هدر</label><label><input type="checkbox" id="bulk-preview" checked> کانفیگ ها</label><label><input type="checkbox" id="bulk-info"> اطلاعاتی</label></div><button class="button secondary" id="bulk-apply" disabled>اعمال روی انتخابی ها</button><button class="button danger" id="bulk-delete" disabled>حذف انتخابی ها</button></div><div class="list" id="list"></div></section>
  </main>
  <div class="backdrop" id="drawer-wrap"><aside class="drawer"><header><div><h2>ویرایش لینک</h2><p id="drawer-title"></p></div><button class="icon" id="drawer-close">×</button></header><form class="grid" id="edit-form"></form></aside></div>
  <script>
    const formFields=[["upstream_url","لینک اصلی سابسکریپشن","url"],["token","توکن دلخواه","text"],["service_name","نام سرویس","text"],["panel_username","Username پنل برای کانفیگ آدمک","text"],["profile_title","نام نمایشی داخل برنامه ها","text"],["device_limit","محدودیت کاربر/دستگاه","number"],["volume_gb","حجم گیگ","number"],["category_key","دسته بندی","text"],["channel_handle","کانال/پشتیبانی اختصاصی","text"],["address_rewrites","بازنویسی آدرس کانفیگ","textarea"]];
    const switches=[["show_header","نمایش هدر"],["show_config_preview","نمایش کانفیگ ها"],["info_proxies_enabled","کانفیگ اطلاعاتی"]];
    const settingLabels={brand_name:"نام برند",subscription_profile_title:"نام نمایشی پیش فرض داخل برنامه ها",subscription_device_limit:"محدودیت دستگاه پیش فرض",primary_color:"رنگ اصلی",accent_color:"رنگ وضعیت",background_color:"رنگ پس زمینه",card_color:"رنگ کارت ها",text_color:"رنگ متن اصلی",muted_text_color:"رنگ متن فرعی",secondary_button_color:"رنگ دکمه فرعی",channel_handle:"کانال پیش فرض",hero_text:"متن بالای صفحه",support_text:"متن پایین صفحه",active_status_text:"متن وضعیت فعال",purchased_volume_label:"عنوان حجم خریداری شده",used_label:"عنوان مصرف شده",remaining_label:"عنوان باقی مانده",expiry_label:"عنوان تاریخ انقضا",config_count_label:"عنوان تعداد کانفیگ",subscription_title:"عنوان لینک اشتراک",copy_button_text:"متن دکمه کپی لینک",copy_success_text:"پیام موفقیت کپی",qr_button_text:"متن دکمه QR",apps_title:"عنوان اتصال سریع",apps_help_text:"راهنمای اتصال سریع",quick_connect_order:"ترتیب اتصال سریع",v2rayng_button_text:"متن V2RayNG",hiddify_button_text:"متن Hiddify",streisand_button_text:"متن Streisand",singbox_button_text:"متن Sing-box",v2box_button_text:"متن V2Box",happ_button_text:"متن HAPP",channel_button_text:"متن دکمه کانال",copy_button_color:"رنگ کپی لینک",qr_button_color:"رنگ QR لینک",v2rayng_button_color:"رنگ V2RayNG",hiddify_button_color:"رنگ Hiddify",streisand_button_color:"رنگ Streisand",singbox_button_color:"رنگ Sing-box",v2box_button_color:"رنگ V2Box",happ_button_color:"رنگ HAPP",channel_button_color:"رنگ کانال",configs_title:"عنوان کانفیگ ها",config_copy_button_text:"متن کپی کانفیگ",config_qr_button_text:"متن QR کانفیگ",config_copy_button_color:"رنگ کپی کانفیگ",config_qr_button_color:"رنگ QR کانفیگ",empty_configs_text:"متن نبود کانفیگ",show_quick_connect:"نمایش اتصال سریع",show_channel_button:"نمایش دکمه کانال",show_config_preview:"نمایش کانفیگ ها",show_config_copy:"نمایش کپی کانفیگ",show_config_qr:"نمایش QR کانفیگ"};
    const textAreas=new Set(["hero_text","support_text","apps_help_text","empty_configs_text"]);
    let state={settings:{},configs:[],selected:new Set(),query:"",editing:null};
    const $=(id)=>document.getElementById(id);
    async function api(url,opts={}){const res=await fetch(url,{...opts,credentials:"same-origin",headers:{"content-type":"application/json",...(opts.headers||{})}});if(!res.ok){let msg="درخواست انجام نشد.";try{const data=await res.json();msg=data.detail||msg}catch{msg=await res.text()}throw new Error(msg)}return res.json()}
    function flash(msg,type="ok"){const box=$("toast");box.textContent=msg;box.className=`toast ${type}`;setTimeout(()=>{box.className="toast";box.textContent=""},4200)}
    function valueOf(form,key){const item=form.elements[key];if(!item)return "";if(item.type==="checkbox")return item.checked;if(item.type==="number")return Number(item.value||0);return item.value}
    function collect(form,keys){const data={};keys.forEach(([key])=>data[key]=valueOf(form,key));switches.forEach(([key])=>data[key]=valueOf(form,key));return data}
    function inputHtml(key,label,type,value=""){if(type==="textarea")return `<label class="wide"><span>${label}</span><textarea name="${key}" dir="ltr">${escapeHtml(value||"")}</textarea></label>`;return `<label><span>${label}</span><input name="${key}" ${type==="url"?"dir='ltr'":""} type="${type}" ${type==="number"?"min='0'":""} value="${escapeHtml(value ?? "")}"></label>`}
    function switchHtml(key,label,checked){return `<label class="switch"><input name="${key}" type="checkbox" ${checked?"checked":""}><span>${label}</span></label>`}
    function renderCreate(){const form=$("create-form");form.innerHTML=formFields.map(([k,l,t])=>inputHtml(k,l,t,k==="category_key"?"manual":k==="device_limit"||k==="volume_gb"?0:"")).join("")+`<div class="switch-row wide">${switches.map(([k,l])=>switchHtml(k,l,k!=="info_proxies_enabled")).join("")}</div><div class="actions wide"><button class="button">ساخت لینک</button></div>`}
    function renderSettings(){const form=$("settings-form");form.innerHTML=Object.entries(state.settings).map(([k,v])=>{const label=settingLabels[k]||k;if(typeof v==="boolean")return switchHtml(k,label,v);if(String(k).endsWith("_color")||["primary_color","accent_color","background_color","card_color","text_color","muted_text_color"].includes(k))return inputHtml(k,label,"color",v);if(textAreas.has(k))return inputHtml(k,label,"textarea",v);return inputHtml(k,label,typeof v==="number"?"number":"text",v)}).join("")+`<div class="actions wide"><button class="button">ذخیره قالب</button></div>`}
    function filtered(){const q=state.query.trim().toLocaleLowerCase("fa-IR");return q?state.configs.filter(c=>(c.search||"").toLocaleLowerCase("fa-IR").includes(q)):state.configs}
    function renderList(){const rows=filtered();$("count").textContent=`${rows.length.toLocaleString("fa-IR")} از ${state.configs.length.toLocaleString("fa-IR")} لینک`;$("selected-count").textContent=state.selected.size?`${state.selected.size.toLocaleString("fa-IR")} انتخاب شده`:"انتخاب همه موارد نمایش داده شده";$("bulk-apply").disabled=!state.selected.size;$("bulk-delete").disabled=!state.selected.size;$("select-all").checked=rows.length>0&&rows.every(c=>state.selected.has(c.id));$("list").innerHTML=rows.length?rows.map(c=>`<article class="row"><input class="row-check" type="checkbox" data-select="${c.id}" ${state.selected.has(c.id)?"checked":""}><div class="main"><div class="title"><strong>${escapeHtml(c.service_name||"-")}</strong><span>${escapeHtml(c.volume_text)}</span>${c.source_panel_key?`<i>${escapeHtml(c.source_panel_key)}</i>`:""}</div><p>${escapeHtml(c.profile_title||"نام نمایشی اختصاصی ندارد")}</p><a href="${escapeAttr(c.public_url)}" target="_blank">${escapeHtml(c.public_url)}</a></div><div class="meta"><span>دستگاه: ${(c.device_count||0).toLocaleString("fa-IR")} / ${c.device_limit||"نامحدود"}</span><span>دسته: ${escapeHtml(c.category_key)}</span></div><div class="row-actions"><button class="icon" title="کپی لینک" data-copy="${escapeAttr(c.public_url)}">⧉</button><a class="icon" title="باز کردن" href="${escapeAttr(c.public_url)}" target="_blank">↗</a><button class="icon" title="ویرایش" data-edit="${c.id}">✎</button><button class="icon" title="ریست دستگاه" data-reset="${c.id}">↻</button><button class="icon danger" title="Revoke" data-revoke="${c.id}">⟳</button><button class="icon danger" title="حذف" data-delete="${c.id}">⌫</button></div></article>`).join(""):`<div class="empty">موردی برای نمایش پیدا نشد.</div>`}
    async function load(){try{const data=await api("/admin/api/bootstrap");state.settings=data.settings;state.configs=data.configs;state.selected=new Set([...state.selected].filter(id=>state.configs.some(c=>c.id===id)));renderCreate();renderSettings();renderList()}catch(e){flash(e.message||"دریافت اطلاعات انجام نشد.","error")}}
    function openEdit(id){const c=state.configs.find(x=>x.id===id);if(!c)return;state.editing=c;$("drawer-title").textContent=c.service_name||c.token;$("edit-form").innerHTML=formFields.filter(([k])=>k!=="token").map(([k,l,t])=>inputHtml(k,l,t,c[k]??"")).join("")+`<div class="switch-row">${switches.map(([k,l])=>switchHtml(k,l,!!c[k])).join("")}</div><div class="actions"><button class="button">ذخیره</button></div>`;$("drawer-wrap").classList.add("open")}
    async function remove(id){const c=state.configs.find(x=>x.id===id);if(!c||!confirm(`لینک «${c.service_name||c.token}» حذف شود؟`))return;try{await api(`/admin/api/subscriptions/${id}`,{method:"DELETE"});state.configs=state.configs.filter(x=>x.id!==id);state.selected.delete(id);renderList();flash("لینک حذف شد.")}catch(e){flash(e.message,"error")}}
    async function simpleAction(id,name){const text=name==="revoke"?"لینک باطل و لینک جدید ساخته شود؟":"شمارش دستگاه ها ریست شود؟";if(!confirm(text))return;try{const data=await api(`/admin/api/subscriptions/${id}/${name==="revoke"?"revoke":"devices/reset"}`,{method:"POST"});if(data.public_url)await navigator.clipboard.writeText(data.public_url);await load();flash(name==="revoke"?"لینک جدید ساخته و کپی شد.":"شمارش دستگاه ریست شد.")}catch(e){flash(e.message,"error")}}
    function escapeHtml(v){return String(v).replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
    function escapeAttr(v){return escapeHtml(v)}
    $("reload").onclick=load;$("settings-toggle").onclick=()=>{$("settings-form").hidden=!$("settings-form").hidden};$("search").oninput=e=>{state.query=e.target.value;renderList()};$("select-all").onchange=e=>{const ids=filtered().map(c=>c.id);state.selected=e.target.checked?new Set(ids):new Set();renderList()};
    $("create-form").onsubmit=async e=>{e.preventDefault();try{const data=await api("/admin/api/subscriptions",{method:"POST",body:JSON.stringify(collect(e.currentTarget,formFields))});state.configs=[data.config,...state.configs.filter(c=>c.id!==data.config.id)];renderCreate();renderList();flash("لینک اختصاصی ساخته شد.")}catch(err){flash(err.message,"error")}};
    $("settings-form").onsubmit=async e=>{e.preventDefault();const data={};Object.entries(state.settings).forEach(([k,v])=>data[k]=valueOf(e.currentTarget,k));try{const res=await api("/admin/api/settings",{method:"POST",body:JSON.stringify(data)});state.settings=res.settings;renderSettings();flash("تنظیمات قالب ذخیره شد.")}catch(err){flash(err.message,"error")}};
    $("edit-form").onsubmit=async e=>{e.preventDefault();if(!state.editing)return;try{const data=await api(`/admin/api/subscriptions/${state.editing.id}`,{method:"PATCH",body:JSON.stringify(collect(e.currentTarget,formFields.filter(([k])=>k!=="token")))});state.configs=state.configs.map(c=>c.id===data.config.id?data.config:c);$("drawer-wrap").classList.remove("open");renderList();flash("تغییرات ذخیره شد.")}catch(err){flash(err.message,"error")}};
    $("drawer-close").onclick=()=>$("drawer-wrap").classList.remove("open");$("bulk-apply").onclick=async()=>{try{const patch={show_header:$("bulk-header").checked,show_config_preview:$("bulk-preview").checked,info_proxies_enabled:$("bulk-info").checked};const data=await api("/admin/api/subscriptions/bulk-update",{method:"POST",body:JSON.stringify({ids:[...state.selected],patch})});state.configs=data.configs;renderList();flash("تنظیمات روی انتخابی ها اعمال شد.")}catch(e){flash(e.message,"error")}};$("bulk-delete").onclick=async()=>{if(!state.selected.size||!confirm(`${state.selected.size} لینک حذف شود؟`))return;try{const data=await api("/admin/api/subscriptions/bulk-delete",{method:"POST",body:JSON.stringify({ids:[...state.selected]})});state.configs=state.configs.filter(c=>!data.deleted_ids.includes(c.id));state.selected.clear();renderList();flash("لینک های انتخاب شده حذف شدند.")}catch(e){flash(e.message,"error")}};
    document.addEventListener("click",e=>{const t=e.target.closest("[data-copy],[data-edit],[data-delete],[data-reset],[data-revoke],[data-select]");if(!t)return;if(t.dataset.copy)navigator.clipboard.writeText(t.dataset.copy);if(t.dataset.edit)openEdit(Number(t.dataset.edit));if(t.dataset.delete)remove(Number(t.dataset.delete));if(t.dataset.reset)simpleAction(Number(t.dataset.reset),"reset");if(t.dataset.revoke)simpleAction(Number(t.dataset.revoke),"revoke");if(t.dataset.select){const id=Number(t.dataset.select);t.checked?state.selected.add(id):state.selected.delete(id);renderList()}});
    load();
  </script>
